:root {

*,

* {

}
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: var(--surface);
}
::-webkit-scrollbar-thumb {
  background: var(--surface-raised);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--underline);
}
::-webkit-scrollbar-corner {
  background: var(--surface);
}

 
h1,
h2,
h3 {
  font-family: var(--font-heading);
  font-weight: 700;
  color: var(--highlight);
  line-height: 1.25;
}
h1 {
  font-size: 1.75rem;
  margin-block: calc(var(--space) * 2) var(--space);
}
h2 {
  font-size: 1.375rem;
  margin-block: calc(var(--space) * 1.5) calc(var(--space) * 0.75);
}
h3 {
  font-size: 1.125rem;
  margin-block: var(--space) calc(var(--space) * 0.5);
}

 
p {
  font-family: var(--font-sans);
  margin-block: var(--space);
}
strong {
  color: var(--highlight);
}
a {
  font-weight: 450;
  color: var(--highlight);
  text-underline-offset: 2px;
  text-decoration: underline;
  text-decoration-color: var(--underline);
}
a:hover {
  text-decoration: underline;
}

 
code {

  font-size: 0.75rem;
  background: var(--surface-raised);
  color: var(--highlight);
  padding: 0.1rem 0.3rem;
}
pre {
  background: var(--surface-raised);
  margin-block: var(--space);
  padding: 1rem;
  overflow-x: auto;
  line-height: 1;
}
pre code {
  background: none;
  padding: 0;
  color: var(--text);
}

 
ul,
ol {
  padding-left: 1.5em;
  margin-block: var(--space);
}
li + li {
  margin-top: 0.25em;
}
li > ul,
li > ol {
  margin-block: 0.25em 0;
}

 
blockquote {

}
blockquote code {
  color: var(--muted);
}
blockquote ul,
blockquote ol {
  list-style: none;
  padding-left: 0;
}
hr {
  border: none;
  border-top: 1px solid var(--surface-raised);
  margin-block: var(--space);
}
img {
  display: block;
  max-width: 100%;
  border: 1px solid var(--surface-raised);
  image-rendering: pixelated;
}
article > :first-child {
  margin-top: 0;
}
article > :last-child {
  margin-bottom: 0;
}

 
table {
  width: 100%;
  border-collapse: collapse;
  margin-block: var(--space);
  font-variant-numeric: tabular-nums;
  table-layout: fixed;
}
th,
td {
  padding: 0.5rem 1rem 0.5rem 0;
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid var(--surface-raised);
}
th {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 0.875rem;
  color: var(--highlight);
}
tr:last-child td {
  border-bottom: none;
}

 
:is(p, blockquote, pre)[id],
.linkable-block {
  position: relative;
}
.anchor-link {
  position: absolute;
  right: 100%;
  top: 0;
  padding-right: 0.4rem;
  opacity: 0;
  text-decoration: none;
  color: var(--muted);
  font-size: 0.85em;
  font-weight: 400;
  line-height: var(--line-height);
  user-select: none;
}
:is(p, blockquote, pre)[id]:hover > .anchor-link,
.linkable-block:hover > .anchor-link {
  opacity: 0.6;
}
.anchor-link:hover {
  opacity: 1 !important;
  color: var(--highlight);
}

 
.layout {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100dvh;

}
.col-left,
.col-right {

aside {

main {

.content-wrapper {

.mobile-bar {

  }
  .mobile-bar .brand {
    margin-bottom: 0;
  }
}
