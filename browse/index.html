	<script>
(function() {
	if (window.matchMedia('(hover: hover)').matches) return;
	
	let activeAnchor = null;
	
	document.addEventListener('click', function(e) {
		const target = e.target;
		
		
		if (target.closest('.anchor-link')) return;
		
		
		const block = target.closest('[id]:is(p, blockquote, pre), .linkable-block');
		if (!block) {
			
			if (activeAnchor) activeAnchor.classList.remove('visible');
			activeAnchor = null;
			return;
		}
		
		const anchor = block.querySelector(':scope > .anchor-link');
		if (!anchor) return;
		
		if (anchor === activeAnchor) {
			
			anchor.classList.remove('visible');
			activeAnchor = null;
		} else {
			
			if (activeAnchor) activeAnchor.classList.remove('visible');
			anchor.classList.add('visible');
			activeAnchor = anchor;
		}
	});
})();
</script>
